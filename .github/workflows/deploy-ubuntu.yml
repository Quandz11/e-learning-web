name: Ubuntu Staging CI/CD

on:
  push:
    branches:
      - ubuntu-staging
    paths:
      - 'e-learning-server/e-learning-server/**'
      - '.github/workflows/deploy-ubuntu.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ubuntu-staging-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build Ubuntu API
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./e-learning-server/e-learning-server
          file: ./e-learning-server/e-learning-server/Dockerfile
          push: true
          tags: ghcr.io/quandz11/e-learning-server:staging-${{ github.sha }}

  deploy:
    name: Deploy Ubuntu Staging
    needs: build
    runs-on: [self-hosted, Linux, X64]

    environment: ubuntu-staging

    permissions:
      contents: read

    if: github.ref == 'refs/heads/ubuntu-staging'

    steps:
      - name: Deploy API
        run: |
          sudo -n /usr/local/sbin/skvi-deploy-api "${GITHUB_SHA}"

      - name: Verify API
        run: |
          curl --fail --silent --show-error \
            http://127.0.0.1:8080/health

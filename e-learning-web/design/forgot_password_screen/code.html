<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduPlatform - Forgot Password</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&amp;family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#007b80",
                        "primary-hover": "#006266",
                        "background-light": "#f9f7f6",
                        "background-dark": "#1c1f22",
                        "card-light": "#ffffff",
                        "card-dark": "#2d3135",
                        "text-main-light": "#0c1c1d",
                        "text-main-dark": "#f0f4f4",
                        "text-sub-light": "#4a5556",
                        "text-sub-dark": "#a0aeb0",
                    },
                    fontFamily: {
                        "display": ["Epilogue", "sans-serif"],
                        "body": ["Manrope", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                    boxShadow: {
                        "soft": "0px 4px 24px rgba(0, 0, 0, 0.06)",
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark text-text-main-light dark:text-text-main-dark transition-colors duration-300 min-h-screen flex flex-col font-body">
<!-- Navbar -->
<nav class="w-full bg-transparent px-6 py-4 lg:px-12 flex justify-between items-center absolute top-0 left-0 z-10">
<div class="flex items-center gap-3 text-primary dark:text-white">
<div class="size-8 rounded-lg bg-primary/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-2xl">school</span>
</div>
<h2 class="font-display font-bold text-xl tracking-tight text-text-main-light dark:text-white">EduPlatform</h2>
</div>
<div class="hidden md:flex gap-4">
<button class="px-4 py-2 text-sm font-semibold text-text-sub-light dark:text-text-sub-dark hover:text-primary dark:hover:text-white transition-colors">
                Need help?
            </button>
</div>
</nav>
<!-- Main Content -->
<main class="flex-grow flex items-center justify-center p-4 relative overflow-hidden">
<!-- Decorative Background Elements -->
<div class="absolute -top-40 -right-40 w-96 h-96 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute top-1/2 -left-20 w-72 h-72 bg-[#FF8C00]/5 rounded-full blur-3xl pointer-events-none"></div>
<!-- Card Container -->
<div class="w-full max-w-[480px] bg-card-light dark:bg-card-dark rounded-xl shadow-soft p-8 md:p-12 relative z-10 transition-colors duration-300 border border-gray-100 dark:border-gray-800">
<!-- Icon Header -->
<div class="mb-8 flex justify-center">
<div class="w-16 h-16 rounded-full bg-primary/10 dark:bg-primary/20 flex items-center justify-center text-primary dark:text-primary-light animate-fade-in">
<span class="material-symbols-outlined text-[32px]">lock_reset</span>
</div>
</div>
<!-- Text Content -->
<div class="text-center mb-8 space-y-3">
<h1 class="font-display text-3xl font-bold tracking-tight text-text-main-light dark:text-white">
                    Forgot Password?
                </h1>
<p class="font-body text-text-sub-light dark:text-text-sub-dark text-base leading-relaxed px-4">
                    No worries, we'll send you reset instructions. Please enter the email associated with your account below.
                </p>
</div>
<!-- Form -->
<form action="#" class="space-y-6" onsubmit="event.preventDefault();">
<div class="space-y-2">
<label class="block text-sm font-semibold text-text-main-light dark:text-white ml-1" for="email">
                        Email Address
                    </label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-gray-400 group-focus-within:text-primary transition-colors">mail</span>
</div>
<input class="block w-full pl-11 pr-4 py-3.5 bg-background-light dark:bg-background-dark border border-gray-200 dark:border-gray-700 rounded-lg text-text-main-light dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all font-body text-base" id="email" name="email" placeholder="jane@university.edu" required="" type="email"/>
</div>
</div>
<button class="w-full bg-primary hover:bg-primary-hover text-white font-display font-bold text-base py-3.5 px-6 rounded-lg shadow-sm hover:shadow-md transition-all duration-200 flex items-center justify-center gap-2 group">
<span>Send Reset Link</span>
<span class="material-symbols-outlined text-lg group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<!-- Back to Login -->
<div class="mt-8 text-center">
<a class="inline-flex items-center gap-2 text-sm font-semibold text-text-sub-light dark:text-text-sub-dark hover:text-primary dark:hover:text-white transition-colors group" href="#">
<span class="material-symbols-outlined text-lg group-hover:-translate-x-1 transition-transform">arrow_back</span>
                    Back to log in
                </a>
</div>
</div>
</main>
<!-- Footer Simple -->
<footer class="w-full py-6 text-center text-sm text-text-sub-light dark:text-text-sub-dark/60 font-body">
<p>© 2024 EduPlatform. All rights reserved.</p>
</footer>
</body></html>

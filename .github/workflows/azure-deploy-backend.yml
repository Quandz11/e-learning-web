name: Deploy Backend to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'e-learning-server/**'
      - '.github/workflows/azure-deploy-backend.yml'
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: rg-elearning
  ACR_NAME: skvielearningacr
  ACR_LOGIN_SERVER: skvielearningacr.azurecr.io
  WEBAPP_NAME: skvi-e-learning

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Backend Docker image
        run: |
          cd e-learning-server/e-learning-server
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/backend:${{ github.sha }} .
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/backend:latest .
          docker push ${{ env.ACR_LOGIN_SERVER }}/backend:${{ github.sha }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/backend:latest

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          images: ${{ env.ACR_LOGIN_SERVER }}/backend:${{ github.sha }}

      - name: Azure logout
        run: az logout
        if: always()
